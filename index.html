<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalinaw Bay Resort — Operations mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 26c6-4 10-4 16 0s10 4 16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M4 33c6-4 10-4 16 0s10 4 16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/><circle cx="27" cy="13" r="6" fill="#E2A13A"/></svg>
      <div><strong>Kalinaw Bay</strong><span>Resort operations</span></div>
    </div>
    <label class="role">
      <span>Viewing as</span>
      <select id="roleSelect">
        <option value="manager">General manager</option>
        <option value="frontdesk">Front desk</option>
        <option value="housekeeping">Housekeeping</option>
        <option value="fnb">Restaurant &amp; bar</option>
        <option value="guest">Guest (phone app)</option>
      </select>
    </label>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <button class="link" id="resetDemo">Reset sample data</button>
      <span class="demo-tag">Demo — all data is fictional</span>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div>
        <h1 id="pageTitle">Today</h1>
        <p id="pageHint" class="hint"></p>
      </div>
      <div class="top-right">
        <span class="today" id="todayLabel"></span>
        <button class="btn ghost" id="howBtn" aria-expanded="false">How this works</button>
      </div>
    </header>
    <section class="how" id="howPanel" hidden></section>
    <section id="view" class="view" tabindex="-1"></section>
  </main>
</div>
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header><h2 id="modalTitle"></h2><button class="x" id="modalClose" aria-label="Close">×</button></header>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="views-ops.js"></script>
<script src="views-rooms.js"></script>
<script src="views-guest.js"></script>
<script src="views-biz.js"></script>
<script>R.start();</script>
</body>
</html>
