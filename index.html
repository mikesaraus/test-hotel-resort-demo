<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camsair Resort — Front desk &amp; operations mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand" aria-label="Camsair Resort">
      <strong>CAMSAIR</strong>
      <span class="brand-rule" aria-hidden="true"><i></i>RESORT<i></i></span>
      <small>Initao, Misamis Oriental</small>
    </div>
    <label class="role">
      <span>Viewing as</span>
      <select id="roleSelect">
        <option value="frontdesk" selected>Front desk</option>
        <option value="manager">General manager</option>
        <option value="housekeeping">Housekeeping</option>
        <option value="fnb">Restaurant &amp; bar</option>
        <option value="guest">Guest (phone app)</option>
      </select>
    </label>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <button class="link" id="resetDemo">Reset sample data</button>
      <span class="demo-tag">Mockup. Guests, rooms and prices are sample data.</span>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div>
        <h1 id="pageTitle">Front desk</h1>
        <p id="pageHint" class="hint"></p>
      </div>
      <div class="top-right">
        <span class="today" id="todayLabel"></span>
        <button class="btn ghost" id="howBtn" aria-expanded="false">How this works</button>
      </div>
    </header>
    <section class="how" id="howPanel" hidden></section>
    <section id="view" class="view" tabindex="-1"></section>
  </main>
</div>
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header><h2 id="modalTitle"></h2><button class="x" id="modalClose" aria-label="Close">×</button></header>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="views-ops.js"></script>
<script src="views-frontdesk.js"></script>
<script src="views-rooms.js"></script>
<script src="views-guest.js"></script>
<script src="views-biz.js"></script>
<script>R.start();</script>
</body>
</html>
