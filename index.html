<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camsair Resort — Property management system (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- one icon set, stroke style, 24px grid -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-desk" viewBox="0 0 24 24"><path d="M4 18h16M6 18v-3a6 6 0 0 1 12 0v3M12 9V7M10 7h4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 0 4v0a2 2 0 0 0 0 4v2h18v-2a2 2 0 0 1 0-4 2 2 0 0 1 0-4V6H3z"/><path d="M14 6v12" stroke-dasharray="2 2"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9v.01M18 15v.01"/></symbol>
    <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 5-6"/></symbol>
    <symbol id="i-cup" viewBox="0 0 24 24"><path d="M5 8h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 9h1a3 3 0 0 1 0 6h-1M8 3v2M12 3v2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><rect x="6" y="14" width="12" height="7"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M3 21l9-16 9 16zM12 5v16M8 21l4-7 4 7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </defs>
</svg>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="side" id="side">
    <div class="brand" aria-label="Camsair Resort">
      <strong>CAMSAIR</strong>
      <span class="brand-rule" aria-hidden="true"><i></i>RESORT<i></i></span>
      <small>Initao, Misamis Oriental</small>
    </div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <button class="link" data-act="guide">Demo guide</button>
      <button class="link" id="resetDemo">Reset sample data</button>
      <span class="demo-tag">Mockup. Guests, rooms and prices are sample data.</span>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <button class="search-btn" data-act="search">
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span>Search guests, bookings, rooms</span><kbd>Ctrl K</kbd>
      </button>
      <a class="biz-date" id="bizDate" href="#audit" title="The night audit closes the day and moves the business date"></a>
      <button class="user-btn" id="userBtn" data-act="switchUser" aria-label="Signed in user. Click to sign in as someone else"></button>
    </div>
    <header class="top">
      <h1 id="pageTitle">Front desk</h1>
      <p id="pageHint" class="hint"></p>
    </header>
    <section id="view" class="view" tabindex="-1"></section>
  </main>
</div>
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header><h2 id="modalTitle"></h2><button class="x" id="modalClose" aria-label="Close">×</button></header>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="views-desk.js"></script>
<script src="views-till.js"></script>
<script src="views-cash.js"></script>
<script src="views-rooms.js"></script>
<script src="views-reports.js"></script>
<script src="views-settings.js"></script>
<script src="views-guest.js"></script>
<script src="views-people.js"></script>
<script>R.start();</script>
</body>
</html>
